<!DOCTYPE html>
<!--
  Spider Riders: Battle for Arachna — self-contained Ruffle launcher.

  Layout notes for whoever touches this next:

  - This file lives directly in flash-source/, alongside SpiderRider_2_edited.swf,
    sprSettings01_EN.xml, and all the scrN_2.swf / world_2.swf / etc. module files.
    That's deliberate: the main shell loads those modules by plain relative
    filename (e.g. "world_2.swf"), so keeping this HTML in the same folder means
    zero path rewriting anywhere — just point Ruffle at "SpiderRider_2_edited.swf"
    and every on-demand load the shell makes resolves the same way it always did.

  - Ruffle itself is vendored locally under ruffle-vendor/ (an official
    "web-selfhosted" release from https://github.com/ruffle-rs/ruffle/releases,
    extracted as-is). No CDN, no network access needed at runtime — this folder
    can be zipped up and handed to someone fully offline.

  - This is a separate file from ruffle_test.html (which intentionally still
    points at the unpkg CDN for quick sanity checks) and from game.html (the
    original 2007 swfobject-based embed, kept untouched for reference).

  - Mission select: before Ruffle boots, visitors see a small "choose a
    mission" screen (dropdown 1-15 plus 3 bonus missions, default Mission 1,
    Start Game button) instead of the player loading immediately. A regular
    mission choice is passed to Ruffle as a `startMission` FlashVar/parameter.
    SpiderRider_2_edited.swf has a small patch in scripts/frame_10/DoAction.as,
    right after the shell's hardcoded `playerStats.mission = 1;`:
        if (startMission != undefined) { playerStats.mission = startMission; }
    The shell's existing frame_54 dispatcher already does
    `gotoAndStop("level" + root.playerStats.mission)`, so setting this one
    variable before boot is all that's needed to land directly on any
    mission. A bonus-mission choice ("Bonus Mission 1/2/3" in the dropdown,
    internally "camp1"/"camp2"/"camp3") instead rides in as a `startCamp`
    FlashVar; frame_10 stashes it on `root.startCamp` and grants the player
    every card in the game (`grantAllCards()`), and frame_54 got a new
    branch, checked before the regular mission dispatch:
        if (root.startCamp != undefined) {
          root.so.data["camp" + root.startCamp] = true;  // bypasses the
          root.so.flush();                                // original promo-
          root.gotoAndPlay("camp" + root.startCamp);       // code gate
        }
    (The date-based lock on these three is already moot regardless — it only
    fires if the real clock is still inside the original 2007-2009 promo
    window, see README.) SpiderRider_2_edited.orig.swf alongside this file is
    the pre-patch backup from before ANY patch in this file, kept in case
    this ever needs reverting.

  - Auto-battle: a floating toggle button (top-right, works the same way as
    2x Speed below — see that entry for why it has to rebuild the player
    rather than flip a value live) sets an `autoBattle` FlashVar.
    SpiderRider_2_edited.swf normalizes it to a real boolean on root
    (frame_10, right after the autoBattle FlashVar read added alongside
    startMission). battleSystem_2.swf's SetMode()
    (DefineSprite_3152/frame_1/DoAction_5.as) checks `root.autoBattle` at the
    two points a human would otherwise click a button: MODE_NEXT_TURN (throws
    dice for you) and MODE_CARD (assigns rolled dice to cards, then attacks).
    The MODE_CARD case now calls a new `AutoAssignDice()` (added right before
    SetMode() in that file) before attacking: for each rolled green/yellow/
    blue die still in `Dices`, it finds a matching inactive card in
    `DeckPlayerInHandUI.Socket01..07` by the same CardID-range rule the
    human drag-and-drop path uses (`Release()`, same file) — green activates
    Weapon/Protection/Item(not 302)/Fusion cards, yellow activates Boost
    cards, blue activates BattleAction cards + item 302 — and calls
    `Activate()` directly, skipping the drag/hitTest entirely since nothing
    async needs to happen. Red and white dice were already fully automatic
    before this patch (resolved by the game itself ahead of MODE_CARD) and
    are untouched. All gated on `CurrentPlayer == TURN_PLAYER`, so the
    existing opponent AI is untouched.

  - Save/load: this SWF version has no FileReference class and no
    ExternalInterface (nothing calls addCallback), so there's no JS<->SWF
    channel except the one-way getURL("javascript:...") bridge already used
    by googleAnalytic(). Given that, saving works like this:
      1. Autosave: frame_10/DoAction.as's autoSaveTick(), on a 5s
         setInterval, snapshots the fields worth keeping (victory points,
         mission, gils, name, card inventory - not avatar/spider
         customization, which was cut from scope to avoid restoring
         `undefined` customization fields as 0 into rendering code this
         patch never traced) into a compact `|`-delimited string (see
         buildSaveString()/applySaveString() in that file), writes it to the
         existing `so` SharedObject (so.data.saveGame - the same local save
         object camp1/2/3 webcodes already use) so it survives a refresh in
         this browser, AND reports it to the page via
         getURL("javascript:onSpiderSave('...')") so "Download current
         save" above has something to offer as a file.
      2. On boot, frame_10 checks for an `importedSave` FlashVar first, then
         so.data.saveGame, and only falls back to the original hardcoded
         blank stats if neither exists - existing saves and brand-new
         players both see unchanged behavior.
      3. Loading a file back in: since there's no JS->SWF channel, picking a
         file in "Load a save file" doesn't reach into a running game - it's
         read client-side and held until Start Game is clicked, at which
         point its contents ride in as the `importedSave` FlashVar above.
    Not yet confirmed with a live playthrough - see README.

  - 2x Speed: a floating toggle button (top-right, works on every screen -
    mission-select or mid-game) passes `frameRate: 60` in Ruffle's load()
    config when on (SpiderRider_2_edited.swf's native rate, verified by
    parsing the SWF header, is 30). No AS patch involved - Ruffle runs one
    movie clock shared by every loaded SWF (missions, battleSystem, etc. all
    execute under the same player instance), so overriding the rate at load
    time doubles all of them at once. Ruffle only lets you pick a frame rate
    when *building* a player instance, not on one already running, so
    toggling mid-game tears the player down and rebuilds it, carrying
    progress forward on the latest autosave (up to ~5s may rewind, and it
    can't preserve an in-progress battle or exact map position - see the
    save/load entry above for exactly what the autosave does and doesn't
    capture). Off = untouched default (native 30fps).

  HOW TO RUN: modern browsers block WebAssembly/fetch from file:// origins, so
  double-clicking this file will NOT work reliably. Serve the folder over HTTP
  instead, e.g. from a terminal in this directory:
      python3 -m http.server 8000
  then open http://localhost:8000/index.html
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spider Riders - Battle for Arachna</title>
<style>
  :root {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0c;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #cfd2d6;
  }

  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #e8e6df;
    text-transform: uppercase;
  }

  /* Locked to the movie's native 4:3 ratio (640x480) so Ruffle never has to
     stretch or crop the content to fit — it just scales the whole box.
     min() picks whichever constraint (viewport width, viewport height, or the
     hard cap) is smallest, so this stays centered and undistorted at any
     window size without any JS resize handling. */
  #stage-wrapper {
    position: relative;
    width: min(92vw, calc(92vh * 4 / 3), 1280px);
    aspect-ratio: 4 / 3;
    background: #000;
    box-shadow: 0 0 0 1px #26262a, 0 20px 60px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  #player {
    display: block;
    width: 100%;
    height: 100%;
  }

  #status {
    min-height: 1.2em;
    font-size: 13px;
    color: #7a7d82;
  }

  #status.error {
    color: #e0736b;
  }

  /* --- Mission select screen, shown before Ruffle boots --- */
  #mission-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: min(92vw, 360px);
    padding: 32px 36px;
    background: #111114;
    box-shadow: 0 0 0 1px #26262a, 0 20px 60px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
  }

  #mission-screen p {
    margin: 0;
    font-size: 13px;
    color: #7a7d82;
    text-align: center;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    justify-content: center;
  }

  .field-row label {
    font-size: 13px;
    color: #cfd2d6;
    letter-spacing: 0.02em;
  }

  #mission-select {
    background: #0a0a0c;
    color: #e8e6df;
    border: 1px solid #26262a;
    padding: 7px 10px;
    font-size: 14px;
    font-family: inherit;
    border-radius: 2px;
    min-width: 120px;
  }

  #mission-select:focus {
    outline: none;
    border-color: #565b63;
  }

  #start-button {
    background: #1c1c20;
    color: #e8e6df;
    border: 1px solid #3a3a40;
    padding: 10px 32px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-family: inherit;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  #start-button:hover {
    background: #26262c;
    border-color: #565b63;
  }

  #start-button:active {
    background: #0a0a0c;
  }

  /* --- Save bar: always visible, above the mission screen / stage --- */
  #save-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 12px;
  }

  #save-file-input {
    color: #cfd2d6;
    font-size: 12px;
    max-width: 220px;
  }

  #download-save-button {
    background: #1c1c20;
    color: #e8e6df;
    border: 1px solid #3a3a40;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-family: inherit;
    border-radius: 2px;
    cursor: pointer;
  }

  #download-save-button:hover:not(:disabled) {
    background: #26262c;
    border-color: #565b63;
  }

  #download-save-button:disabled {
    color: #55585c;
    cursor: default;
  }

  #save-status {
    color: #7a7d82;
    font-size: 12px;
  }

  .hidden {
    display: none !important;
  }

  #speed-toggle-bar {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  #speed-toggle-button, #autobattle-toggle-button {
    background: #1c1c20;
    color: #e8e6df;
    border: 1px solid #3a3a40;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-family: inherit;
    border-radius: 2px;
    cursor: pointer;
  }

  #speed-toggle-button:hover, #autobattle-toggle-button:hover {
    background: #26262c;
    border-color: #565b63;
  }

  #speed-toggle-button.active, #autobattle-toggle-button.active {
    background: #2f6f3e;
    border-color: #4c9a5e;
  }

  #speed-toggle-note {
    color: #7a7d82;
    font-size: 11px;
    max-width: 200px;
    text-align: right;
  }
</style>
</head>
<body>

<h1>Spider Riders &mdash; Battle for Arachna</h1>

<div id="speed-toggle-bar">
  <button id="speed-toggle-button" type="button">2x Speed: Off</button>
  <button id="autobattle-toggle-button" type="button">Auto-battle: Off</button>
  <span id="speed-toggle-note"></span>
</div>

<div id="save-bar">
  <div class="field-row">
    <label for="save-file-input">Load a save file</label>
    <input id="save-file-input" type="file" accept=".txt,.sav,text/plain" />
  </div>
  <button id="download-save-button" type="button" disabled>Download current save</button>
  <span id="save-status"></span>
</div>

<div id="mission-screen">
  <p>Choose a mission to start from.</p>
  <div class="field-row">
    <label for="mission-select">Mission</label>
    <select id="mission-select"></select>
  </div>
  <button id="start-button" type="button">Start Game</button>
</div>

<div id="stage-wrapper" class="hidden"></div>

<div id="status" class="hidden"></div>

<script>
  window.RufflePlayer = window.RufflePlayer || {};

  window.addEventListener("DOMContentLoaded", () => {
    const missionScreenEl = document.getElementById("mission-screen");
    const stageWrapperEl = document.getElementById("stage-wrapper");
    const statusEl = document.getElementById("status");
    const missionSelectEl = document.getElementById("mission-select");
    const startButtonEl = document.getElementById("start-button");
    const saveFileInputEl = document.getElementById("save-file-input");
    const downloadSaveButtonEl = document.getElementById("download-save-button");
    const saveStatusEl = document.getElementById("save-status");
    const speedToggleButtonEl = document.getElementById("speed-toggle-button");
    const speedToggleNoteEl = document.getElementById("speed-toggle-note");
    const autoBattleToggleButtonEl = document.getElementById("autobattle-toggle-button");

    // Same rebuild-on-toggle story as `speedDoubled` below - there's no
    // ExternalInterface in this SWF for JS to poke a running instance's
    // `root.autoBattle` live, so toggling mid-game means tearing the player
    // down and relaunching it with the new FlashVar value.
    let autoBattleOn = false;

    // Whether the *currently loaded* player (if any) was launched at 60fps.
    // Ruffle only lets you pick a frame rate when building a player instance
    // (ruffleinstancebuilder_setFrameRate is a construction-time call, not a
    // method on the running player) - there's no live "change speed" knob on
    // an instance already playing. So toggling mid-game means tearing down
    // the current player and rebuilding one with the other rate, which is
    // why this lives at the top level instead of as a mission-screen
    // checkbox: it has to work the same way whether you're still on the
    // mission-select screen (no player yet - just remembers the choice for
    // the next Start Game) or mid-playthrough (rebuilds immediately).
    let speedDoubled = false;
    let currentPlayerEl = null;

    // Latest save string reported by the running SWF (frame_10/DoAction.as
    // calls `getURL("javascript:onSpiderSave('...')")` every autosave tick,
    // ~5s, since there's no ExternalInterface in this old SWF version to pull
    // data out any other way). Whatever the SWF last reported is what
    // "Download current save" writes to a file.
    let latestSave = null;
    // Contents of a save file the visitor picked before clicking Start Game.
    // There's no JS -> SWF channel either, so this rides in as a FlashVar
    // (`importedSave`, read by the same frame_10 patch) rather than being
    // injected into a running game.
    let importedSaveText = null;

    window.onSpiderSave = (escapedSaveStr) => {
      // AS2 only has escape()/unescape() (predates encodeURIComponent), and
      // escape() emits %uXXXX for non-ASCII, which decodeURIComponent can't
      // parse - unescape() is deprecated but is the actual matching decoder.
      latestSave = unescape(escapedSaveStr);
      downloadSaveButtonEl.disabled = false;
    };

    downloadSaveButtonEl.addEventListener("click", () => {
      if (!latestSave) return;
      const blob = new Blob([latestSave], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "spider-riders-save.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    saveFileInputEl.addEventListener("change", () => {
      const file = saveFileInputEl.files[0];
      if (!file) return;
      file.text().then((text) => {
        const trimmed = text.trim();
        if (trimmed.split("|").length < 5) {
          saveStatusEl.textContent = "That doesn't look like a Spider Riders save file.";
          saveFileInputEl.value = "";
          return;
        }
        importedSaveText = trimmed;
        saveStatusEl.textContent = "Save loaded - it'll be used when you click Start Game.";
      });
    });

    const BOSS_FIGHTS = {
      buguese: { label: "Buguese", flashVar: "startBuguese" },
      magma: { label: "Magma", flashVar: "startMagma" },
      stag: { label: "Stag", flashVar: "startStag" },
      lumens: { label: "Prince Lumens", flashVar: "startLumens" },
    };

    // Populate the mission dropdown: Mission 1 .. Mission 15, default = 1,
    // plus the 3 bonus "camp" missions. Camp values are prefixed "camp" so
    // launchPlayer can tell them apart from a plain mission number - they
    // launch via a different FlashVar (startCamp, not startMission) since
    // they're a separate part of the shell (frame_54's dispatcher), not one
    // of the scrN_2.swf mission modules.
    for (let i = 1; i <= 15; i++) {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = "Mission " + i;
      if (i === 1) {
        opt.selected = true;
      }
      missionSelectEl.appendChild(opt);
    }
    for (let i = 1; i <= 3; i++) {
      const opt = document.createElement("option");
      opt.value = "camp" + i;
      opt.textContent = "Bonus Mission " + i;
      missionSelectEl.appendChild(opt);
    }
    // Standalone boss fights, previously only reachable through the dead
    // multiplayer world hub - each rides its own startX FlashVar into a
    // frame_54 branch that calls startBossFight() directly (see frame_10/
    // DoAction.as). BOSS_FIGHTS maps dropdown value -> {label, flashVar}.
    for (const [value, { label }] of Object.entries(BOSS_FIGHTS)) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label + " (Boss Fight)";
      missionSelectEl.appendChild(opt);
    }

    const setStatus = (msg, isError) => {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", !!isError);
    };

    // (re)builds the Ruffle player. `saveToUse` is passed explicitly by every
    // caller (rather than defaulting to `importedSaveText` in here) so the
    // speed toggle's "no autosave yet" case can unambiguously mean "launch
    // with no save" instead of silently falling back to a stale file pick.
    const launchPlayer = (saveToUse) => {
      const selectedValue = missionSelectEl.value;
      const chosenCamp = selectedValue.indexOf("camp") === 0 ? selectedValue.slice(4) : null;
      const chosenBossFlashVar = BOSS_FIGHTS[selectedValue] ? BOSS_FIGHTS[selectedValue].flashVar : null;
      const chosenMission = String(parseInt(selectedValue, 10) || 1);
      const chosenAutoBattle = String(autoBattleOn);

      missionScreenEl.classList.add("hidden");
      stageWrapperEl.classList.remove("hidden");
      statusEl.classList.remove("hidden");
      setStatus("Loading…");

      if (currentPlayerEl) {
        currentPlayerEl.remove();
        currentPlayerEl = null;
      }

      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.id = "player";
        stageWrapperEl.appendChild(player);
        currentPlayerEl = player;

        player
          .load({
            url: "SpiderRider_2_edited.swf",
            parameters: {
              userLang: "EN",
              GAMEDEBUG: "false",
              xmlNbr: "01",
              startMission: chosenMission,
              autoBattle: chosenAutoBattle,
              ...(chosenCamp ? { startCamp: chosenCamp } : {}),
              ...(chosenBossFlashVar ? { [chosenBossFlashVar]: "1" } : {}),
              ...(saveToUse ? { importedSave: saveToUse } : {}),
            },
            allowScriptAccess: true,
            backgroundColor: "#000000",
            // "on" = always letterbox to preserve aspect ratio (never stretch/
            // distort), matching the fixed 4:3 stage-wrapper above.
            letterbox: "on",
            // SpiderRider_2_edited.swf's native rate is 30fps (verified by
            // parsing the SWF header). Ruffle only has one movie clock shared
            // by every loaded SWF (missions, battleSystem, etc. all run under
            // the same player instance), so overriding it here doubles
            // everything at once with no AS patch needed - and it applies to
            // every screen (walking around a mission, menus, battle) since
            // they're all driven by that one clock.
            ...(speedDoubled ? { frameRate: 60 } : {}),
          })
          .then(() => setStatus(""))
          .catch((e) => {
            console.error("Ruffle player.load() rejected:", e);
            setStatus("Failed to load the game: " + e, true);
          });
      } catch (e) {
        console.error("Ruffle setup exception:", e);
        setStatus("Failed to initialize Ruffle: " + e, true);
      }
    };

    startButtonEl.addEventListener("click", () => launchPlayer(importedSaveText));

    const updateSpeedToggleUi = () => {
      speedToggleButtonEl.textContent = "2x Speed: " + (speedDoubled ? "On" : "Off");
      speedToggleButtonEl.classList.toggle("active", speedDoubled);
    };
    updateSpeedToggleUi();

    speedToggleButtonEl.addEventListener("click", () => {
      speedDoubled = !speedDoubled;
      updateSpeedToggleUi();

      if (!currentPlayerEl) {
        // Still on the mission-select screen - nothing running yet, so just
        // remember the choice for the Start Game click.
        return;
      }

      // A player is already running: the only way to change its frame rate
      // is to rebuild it from scratch (see the note by `speedDoubled`
      // above), so carry the game forward on the latest autosave rather than
      // dropping the player back to blank stats. `latestSave` only updates
      // every ~5s (frame_10/DoAction.as's autoSaveTick interval - see
      // README), so this can rewind up to that much unsaved progress, and it
      // can't restore an in-progress battle or exact map position (the
      // autosave only tracks victory points/mission/gils/name/cards, not
      // battle state) - the mission itself restarts at its entry point.
      speedToggleNoteEl.textContent = latestSave
        ? "Reloading from last autosave (up to ~5s of progress may rewind)…"
        : "Reloading - no autosave yet, so this restarts the current mission from scratch…";
      launchPlayer(latestSave || null);
      setTimeout(() => { speedToggleNoteEl.textContent = ""; }, 4000);
    });

    const updateAutoBattleToggleUi = () => {
      autoBattleToggleButtonEl.textContent = "Auto-battle: " + (autoBattleOn ? "On" : "Off");
      autoBattleToggleButtonEl.classList.toggle("active", autoBattleOn);
    };
    updateAutoBattleToggleUi();

    autoBattleToggleButtonEl.addEventListener("click", () => {
      autoBattleOn = !autoBattleOn;
      updateAutoBattleToggleUi();

      if (!currentPlayerEl) {
        return;
      }

      // Same rebuild-and-carry-forward-on-autosave story as the speed
      // toggle above - see its comment for the exact tradeoffs.
      speedToggleNoteEl.textContent = latestSave
        ? "Reloading from last autosave (up to ~5s of progress may rewind)…"
        : "Reloading - no autosave yet, so this restarts the current mission from scratch…";
      launchPlayer(latestSave || null);
      setTimeout(() => { speedToggleNoteEl.textContent = ""; }, 4000);
    });
  });
</script>
<script src="ruffle-vendor/ruffle.js"></script>

</body>
</html>
